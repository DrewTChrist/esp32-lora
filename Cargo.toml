[package]
name    = "esp32-lora"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-hal = { version = "1.2.0", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32"] }


[features]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
